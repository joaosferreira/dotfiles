"$schema" = "https://starship.rs/config-schema.json"

format = """
$directory\
$git_branch\
$git_status\
$character"""

add_newline = false

[directory]
truncation_length = 100
truncate_to_repo = true
read_only = " \uf023"

[git_branch]
symbol = "\uf418 "

[git_status]
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "\\$"
modified = "~"
staged = "+"
renamed = "»"
deleted = "✘"

[character]
success_symbol = "[\u276f](green)"
error_symbol = "[\u276f](red)"
